name: Build and run tests on Windows
runs:
  using: "composite"
  steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Restore vcpkg
      uses: actions/cache@v4
      id: vcpkg-installed
      with:
        path: ${{ env.VCPKG_ROOT }}/installed
        key: ${{ runner.os }}-vcpkg-installed-v3
        restore-keys: |
          ${{ runner.os }}-vcpkg-installed-v3

    - name: Install dependencies
      shell: bash
      if: steps.vcpkg-installed.outputs.cache-hit != 'true'
      run: |-
        vcpkg install --triplet x64-windows \
          boost-algorithm boost-endian boost-format boost-functional boost-program-options boost-json \
          glm sdl2 sdl3 glew openal-soft libmad ffmpeg wxwidgets gtest

    - name: Generate solution
      shell: bash
      run: |-
        mkdir build
        cmake -S . -B build \
          -G "Visual Studio 17 2022" -A x64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build solution
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config Release 2>&1 | tee build.log

    - name: Run tests
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: ctest -VV -C Release 2>&1 | tee ctest.txt

    # The run's logs aren't always at hand where it is read: its summary, and
    # on failure the first errors, go into annotations too.
    - name: Annotate the test summary
      shell: bash
      if: always()
      working-directory: ${{github.workspace}}/build
      run: |-
        if [ -f ctest.txt ]; then
          sed 's/^[0-9]*: //' ctest.txt | grep -E '^\[==========\]|^\[  PASSED  \]|^\[  SKIPPED \] [0-9]|tests passed|tests failed' | head -n 8 | sed 's/%/%25/g; s/^/::notice title=tests::/' || true
          sed 's/^[0-9]*: //' ctest.txt | grep -E '^\[  FAILED  \] [A-Za-z]' | head -n 9 | sed 's/%/%25/g; s/^/::error title=failed test::/' || true
        fi
        if [ -f build.log ]; then
          grep -E ': (fatal )?error ' build.log | head -n 9 | sed 's/%/%25/g; s/^/::error title=build::/' || true
        fi
