name: 'Build and run tests on Linux'
runs:
  using: "composite"
  steps:
      - name: Install dependencies
        shell: bash
        run: |-
          apt-get update
          apt install --no-install-recommends -y \
            cmake build-essential g++ \
            libboost-all-dev libsdl2-dev libsdl3-dev libglew-dev libopenal-dev libmad0-dev libwxgtk3.2-dev libgmock-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Create Build Environment
        shell: bash
        working-directory: ${{github.workspace}}
        run: cmake -E make_directory build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake --build . 2>&1 | tee build.log

      - name: Run Unit Tests
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: ctest -VV 2>&1 | tee ctest.txt

      # As on Windows: the summary, and on failure the first errors, as annotations.
      - name: Annotate the test summary
        shell: bash
        if: always()
        working-directory: ${{github.workspace}}/build
        run: |-
          if [ -f ctest.txt ]; then
            sed 's/^[0-9]*: //' ctest.txt | grep -E '^\[==========\]|^\[  PASSED  \]|^\[  SKIPPED \] [0-9]|tests passed|tests failed' | head -n 8 | sed 's/%/%25/g; s/^/::notice title=tests::/' || true
            sed 's/^[0-9]*: //' ctest.txt | grep -E '^\[  FAILED  \] [A-Za-z]' | head -n 9 | sed 's/%/%25/g; s/^/::error title=failed test::/' || true
          fi
          if [ -f build.log ]; then
            grep -E ': (fatal )?error' build.log | head -n 9 | sed 's/%/%25/g; s/^/::error title=build::/' || true
          fi
