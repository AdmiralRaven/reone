name: Build a release on Windows
on:
  push:
    tags: ["*"]
  workflow_dispatch:
env:
  VCPKG_ROOT: C:/vcpkg

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Branch names may contain slashes, which file and release names may not.
      # A branch build also names its commit, so that each build gets its own
      # draft release.
      - name: Name the release
        shell: bash
        run: |-
          tag="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            tag="$tag-${GITHUB_SHA::7}"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE=reone-$tag" >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-windows

      - name: Zip
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |-
          mkdir $RELEASE
          mv bin $RELEASE/
          7z a -r $RELEASE.zip $RELEASE

      - name: Tag a release
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |-
          cp ctest.txt $RELEASE-tests.txt
          gh release create $TAG $RELEASE.zip $RELEASE-tests.txt \
            --target "${{ github.sha }}" \
            --title "Reone $TAG" \
            --notes "Commit: ${{github.sha}}" \
            --draft --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
